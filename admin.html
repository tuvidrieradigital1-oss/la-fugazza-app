<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - La Fugazza</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen" class="login-box">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email" value="tuvidrieradigital1@gmail.com">
        <input type="password" id="password" placeholder="Clave" value="clave1234">
        <button onclick="login()">Ingresar</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">
        <div class="admin-header">
            <h1>Panel de Control</h1>
            <button onclick="logout()" style="background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor:pointer;">Salir</button>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab active" onclick="showTab('orders', this)">📋 Pedidos</button>
            <button class="admin-tab" onclick="showTab('tables', this); loadTables();">🪑 Mesas</button>
            <button class="admin-tab" onclick="showTab('ranking', this); loadRanking();">🏆 Ranking</button>
        </div>

        <!-- Pedidos -->
        <div id="tab-orders" class="tab-content active">
            <h2>Pedidos en Tiempo Real</h2>
            <div id="orders-list"><p class="empty-msg">Cargando...</p></div>
        </div>

        <!-- Mesas -->
        <div id="tab-tables" class="tab-content">
            <h2>Mesas Activas</h2>
            <div id="tables-list"><p class="empty-msg">Cargando...</p></div>
        </div>

        <!-- Ranking -->
        <div id="tab-ranking" class="tab-content">
            <h2>🏆 Ranking del Mes</h2>
            <div id="ranking-list" class="card"><p class="empty-msg">Cargando...</p></div>
        </div>
    </div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/admin.js"></script>
    <script>
        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
